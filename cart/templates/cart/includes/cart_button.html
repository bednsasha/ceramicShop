{% load cart_tags %}
<button class="relative group">
    <span class="text-sm font-medium text-gray-900 group-hover:text-gray-700">
        КОРЗИНА ({% get_cart_count %})
    </span>
    {% if cart_total_items > 0 %}
    <span class="absolute -top-2 -right-2 h-5 w-5 bg-terracotta text-white text-xs rounded-full flex items-center justify-center font-medium">
        {{ cart_total_items }}
    </span>
    {% endif %}
</button>
