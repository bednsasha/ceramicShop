<div class="relative inline-block w-full">
    <input type="text" 
           id="search-input-desktop" 
           name="q" 
           placeholder="ПОИСК" 
           value="{{ search_query|default:'' }}"
           class="w-48 bg-white border border-[#E8E2D9] py-2 px-3 text-sm font-medium uppercase focus:outline-none focus:border-[#2A2E4D] rounded-full"
           style="color: #4A3B32; font-family: 'Chiron GoRound TC', 'Inter', sans-serif;"
           hx-get="/catalog/" 
           hx-target="#main-content" 
           hx-push-url="true"
           hx-trigger="input delay:500ms"
           hx-swap="innerHTML"
           hx-indicator="#loading-indicator">
    <button class="absolute right-2 top-1/2 -translate-y-1/2 text-[#7A685A] hover:text-[#2A2E4D] transition-colors"
            hx-get="/catalog/?reset_search=true" 
            hx-target="#desktop-search-container"
            hx-swap="innerHTML">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('search-input-desktop');
        if (searchInput) {
            searchInput.focus();
            searchInput.addEventListener('input', function() {
                if (this.value) {
                    this.placeholder = '';
                } else {
                    this.placeholder = 'ПОИСК';
                }
            });
        }
    });
</script>
