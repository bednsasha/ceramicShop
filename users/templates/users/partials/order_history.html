<div class="p-6" style="background-color: #FDFBF7; border: 1px solid #E8E2D9; border-radius: 1rem;">
    <h2 class="text-xl mb-4 tracking-wide" 
        style="color: #4A3B32; font-family: 'Chiron GoRound TC', 'Inter', sans-serif; font-weight: 500;">
        История заказов
    </h2>
    {% if orders %}
        <div class="space-y-4">
            {% for order in orders %}
                <div class="pb-4 last:border-0" style="border-bottom: 1px solid #E8E2D9;">
                    <p class="text-sm font-medium" style="color: #4A3B32;">Заказ #{{ order.id }}</p>
                    <p class="text-sm mt-1" style="color: #7A685A;">Дата: {{ order.created_at|date:"d F Y" }}</p>
                    <p class="text-sm" style="color: #7A685A;">Статус: {{ order.get_status_display }}</p>
                    <p class="text-sm font-medium mt-1" style="color: #4A3B32;">{{ order.total_price }} ₽</p>
                    <button 
                        hx-get="{% url 'users:order_detail' order.id %}" 
                        hx-target="#profile-main-content" 
                        hx-push-url="true"
                        class="mt-3 text-sm py-1.5 px-4 font-medium uppercase tracking-wide transition-all duration-300 rounded-full"
                        style="border: 1.5px solid #2A2E4D; background-color: transparent; color: #2A2E4D; cursor: pointer;"
                        onmouseover="this.style.backgroundColor='#2A2E4D'; this.style.color='white'; this.style.transform='translateY(-2px)'"
                        onmouseout="this.style.backgroundColor='transparent'; this.style.color='#2A2E4D'; this.style.transform='translateY(0)'">
                        Подробнее
                    </button>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="text-sm" style="color: #7A685A;">У вас пока нет заказов.</p>
        <a href="{% url 'products:index' %}" 
           hx-get="{% url 'products:index' %}" 
           hx-target="#main-content" 
           hx-push-url="true"
           class="inline-block mt-4 text-sm py-2 px-4 font-medium uppercase tracking-wide transition-all duration-300 rounded-full hover:shadow-md active:scale-[0.98]"
           style="background-color: #2A2E4D; color: white;">
            Начать покупки
        </a>
    {% endif %}
</div>
